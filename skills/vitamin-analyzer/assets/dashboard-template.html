<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Supplement stack dashboard</title>
<style>
:root{color-scheme:light;
  --fg:#1f1d1a;--muted:#6b665e;--bg:#f6f4f0;--panel:#ffffff;--line:#e4e0d8;
  --ok:#23864f;--warn:#b05f0a;--bad:#c2412d;
  --r:12px;--gap-sm:8px;--gap-md:12px;--gap-lg:20px;--pad-sm:10px;--pad-md:14px;--pad-lg:20px;
  --fs-title:1.75rem;--fs-h:1.0625rem;--fs-body:.9375rem;--fs-cap:.8125rem;
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Apple Myungjo","Noto Serif KR",serif;
  --ease:cubic-bezier(.22,1,.36,1);--dur:.25s}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--fs-body);line-height:1.5}
.sx{padding:clamp(16px,3vw,32px);display:grid;gap:var(--gap-lg);max-width:76rem;margin-inline:auto;word-break:keep-all;overflow-wrap:anywhere;min-width:0}
.sx[hidden],.sx-err[hidden]{display:none}
.sx-head{display:grid;gap:6px;min-width:0}
.sx-title{font-family:var(--serif);font-weight:400;font-size:var(--fs-title);margin:0;text-wrap:balance}
.sx-meta{color:var(--muted);font-size:var(--fs-cap);margin:0}
.sx-meta:empty{display:none}
.sx-banners{display:grid;gap:8px;margin:4px 0}
.sx-banners:empty{display:none}
.sx-banner{margin:0;padding:10px 14px;border-radius:calc(var(--r) - 2px);border:1px solid var(--bad);border-left-width:5px;background:color-mix(in srgb,var(--bad) 8%,var(--panel));line-height:1.6}
.sx-verdict{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:6px}
.sx-badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:6px 14px;border-radius:999px;color:#fff;transition:background var(--dur)}
.sx-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.sx-badge[data-tone="bad"]{background:var(--bad)}
.sx-badge[data-tone="warn"]{background:var(--warn)}
.sx-badge[data-tone="ok"]{background:var(--ok)}
.sx-say{line-height:1.6;margin:0;max-width:62ch;min-width:0}

.sx-main{display:grid;gap:var(--gap-lg);grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:880px){.sx-main{grid-template-columns:minmax(17rem,21rem) minmax(0,1fr)}.sx-side{position:sticky;top:12px}}
.sx-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad-lg);display:grid;gap:var(--gap-md);min-width:0;position:relative}
.sx-h{font-size:var(--fs-h);font-weight:600;margin:0}
.sx-note{font-size:var(--fs-cap);color:var(--muted);margin:0;line-height:1.55}

.sx-prods{display:grid;gap:10px}
.sx-prod{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:calc(var(--r) - 2px);border:1px solid var(--line);transition:border-color var(--dur)}
.sx-prod.changed{border-color:var(--fg)}
.sx-cap{width:30px;height:15px;border-radius:8px;position:relative;overflow:hidden;flex:none}
.sx-cap::after{content:"";position:absolute;inset:0 0 0 50%;background:var(--panel);opacity:.55}
.sx-pname{font-weight:600;line-height:1.3}
.sx-pkind{font-size:var(--fs-cap);color:var(--muted)}
.sx-pwarn{font-size:var(--fs-cap);color:var(--bad)}
.sx-plock{font-size:var(--fs-cap);color:var(--muted)}
.sx-step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sx-step button{font:inherit;width:34px;height:34px;border:0;background:transparent;color:var(--fg);font-size:18px;line-height:1;cursor:pointer}
.sx-step button:hover:not(:disabled){background:var(--line)}
.sx-step button:active:not(:disabled){transform:scale(.96)}
.sx-step button:disabled{color:var(--muted);opacity:.4;cursor:default}
.sx-step button:focus-visible{outline:2px solid var(--fg);outline-offset:-2px}
.sx-count{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.sx-count b{font-family:var(--serif);font-weight:400;font-size:1.25rem}
.sx-presets{display:flex;flex-wrap:wrap;gap:8px}
.sx-preset{font:inherit;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.sx-preset[hidden]{display:none}
.sx-preset[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sx-preset:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sx-plan{font-size:var(--fs-cap);color:var(--muted);margin:0}
.sx-plan:empty{display:none}

.sx-score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap-sm)}
@media (min-width:1180px){.sx-score{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sx-tile{display:grid;gap:2px;padding:12px 14px;border-radius:calc(var(--r) - 2px);background:var(--bg);border:1px solid var(--line);align-content:start;min-width:0}
.sx-tile .l{font-size:var(--fs-cap);color:var(--muted)}
.sx-tile .v{font-family:var(--serif);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums;transition:color var(--dur)}
.sx-tile .v small{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin-left:2px}
.sx-tile .s{font-size:var(--fs-cap);color:var(--muted);min-height:1.2em}
.sx-tile[data-tone="bad"] .v{color:var(--bad)}
.sx-tile[data-tone="warn"] .v{color:var(--warn)}
.sx-tile[data-tone="ok"] .v{color:var(--ok)}

.sx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-cap);color:var(--muted)}
.sx-legend span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.sx-sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sx-rows{display:grid;gap:4px}
.sx-axis,.sx-row{display:grid;grid-template-columns:minmax(4.6rem,6.5rem) minmax(0,1fr) 4.4rem 6.4rem;align-items:center;gap:10px}
.sx-axis{font-size:11px;color:var(--muted)}
.sx-axis .t{position:relative;height:14px}
.sx-axis .t span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.sx-row{padding:5px 0;border-radius:6px;cursor:default}
.sx-row:hover,.sx-row:focus-visible{background:var(--bg);outline:none}
.sx-row:focus-visible{box-shadow:0 0 0 2px var(--fg)}
.sx-name{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-track{position:relative;height:16px;border-radius:5px}
.sx-fill{position:absolute;left:0;top:2px;bottom:2px;display:flex;border-radius:4px;overflow:hidden;transition:width .55s var(--ease)}
.sx-seg{height:100%;flex:none;transition:width .55s var(--ease)}
.sx-fill.capped{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.sx-ref{position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;background:var(--fg);opacity:.75;border-radius:1px}
.sx-ul{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--bad);border-radius:2px}
.sx-pct{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;white-space:nowrap;transition:color var(--dur)}
.sx-pct::after{content:"%";font-weight:400;color:var(--muted);margin-left:1px}
.sx-chip{justify-self:start;font-size:var(--fs-cap);padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.sx-chip:empty{display:none}
.sx-chip.pop{animation:sxPop .6s var(--ease)}
@keyframes sxPop{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
[data-t="bad"]{color:var(--bad)}
[data-t="warn"]{color:var(--warn)}
[data-t="ok"]{color:var(--ok)}
[data-t="neutral"]{color:var(--muted)}
@media (max-width:520px){
  .sx-axis,.sx-row{grid-template-columns:4.4rem minmax(0,1fr) 4rem;gap:8px}
  .sx-chip,.sx-axis .c{display:none}
}
.sx-tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 6px 20px rgba(31,29,26,.14);padding:8px 12px;font-size:var(--fs-cap);max-width:min(18rem,calc(100% - 16px));z-index:3;line-height:1.55}
.sx-tip[hidden]{display:none}
.sx-tip .k{color:var(--muted)}
.sx-tip .p{display:flex;align-items:center;gap:6px}

.sx-disc1{font-size:var(--fs-cap);color:var(--muted);margin:0}
details.sx-more{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
details.sx-more>summary{cursor:pointer;padding:var(--pad-md) var(--pad-lg);font-size:var(--fs-h);font-weight:600;list-style-position:inside}
details.sx-more>summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:var(--r)}
.sx-more-body{display:grid;gap:var(--gap-lg);padding:0 var(--pad-lg) var(--pad-lg);min-width:0}
.sx-more-body section{min-width:0}
.sx-scroll{overflow-x:auto}
table.sx-t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;overflow-wrap:normal;word-break:normal}
.sx-t th{font-weight:600;font-size:var(--fs-cap);color:var(--muted);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.sx-t td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.sx-t td.num{text-align:right;white-space:nowrap}
.sx-t .sx-chip{margin-left:6px}
.sx-list{margin:0;padding-left:1.1em;font-size:var(--fs-cap);color:var(--muted);line-height:1.65}
.sx-src{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:var(--fs-cap);color:var(--muted)}
a{color:var(--muted)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.sx-disc{font-size:var(--fs-cap);color:var(--muted);line-height:1.65}
.sx-disc p{margin:0 0 4px}
.sx-disc ul{margin:4px 0;padding-left:1.1em}
.sx-disc blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line)}
.sx-disc .sx-h{margin:0 0 6px}

.sx-err{max-width:40rem;margin:clamp(16px,6vw,64px) auto;padding:0 clamp(16px,3vw,32px);word-break:keep-all;overflow-wrap:anywhere}
.sx-err .sx-card{border-left:5px solid var(--bad);gap:8px}
.sx-err p{margin:0}
.sx-err .d{font-size:var(--fs-cap);color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){.sx-fill,.sx-seg,.sx-badge,.sx-pct,.sx-tile .v,.sx-prod{transition:none}.sx-chip.pop{animation:none}.sx-step button:active:not(:disabled){transform:none}}
</style>
</head>
<body>
<noscript><p style="padding:16px">JavaScript is required to show this dashboard.</p></noscript>

<main class="sx" id="app" hidden>
  <header class="sx-head">
    <h1 class="sx-title" id="title"></h1>
    <div class="sx-banners" id="banners" aria-live="polite"></div>
    <p class="sx-meta" id="meta"></p>
    <p class="sx-meta" id="meta2"></p>
    <div class="sx-verdict">
      <span class="sx-badge" id="badge" data-tone="warn"></span>
      <p class="sx-say" id="say"></p>
    </div>
  </header>

  <div class="sx-main">
    <aside class="sx-side sx-card" id="controls">
      <h2 class="sx-h" data-k="ctrlTitle"></h2>
      <p class="sx-note" data-k="ctrlNote"></p>
      <div class="sx-prods" id="prods"></div>
      <div class="sx-presets" role="group" id="presets">
        <button type="button" class="sx-preset" id="pre-now" aria-pressed="true"></button>
        <button type="button" class="sx-preset" id="pre-plan" aria-pressed="false"></button>
      </div>
      <p class="sx-plan" id="plan-text"></p>
    </aside>

    <section class="sx-card" id="board">
      <div class="sx-score" id="score">
        <div class="sx-tile" id="t-ul"><span class="l" data-k="tileUl"></span><span class="v"><span class="n">-</span><small>%</small></span><span class="s"></span></div>
        <div class="sx-tile" id="t-low"><span class="l" data-k="tileLow"></span><span class="v"><span class="n">-</span><small data-k="unitKinds"></small></span><span class="s"></span></div>
        <div class="sx-tile" id="t-over"><span class="l" data-k="tileOver"></span><span class="v"><span class="n">-</span><small data-k="unitKinds"></small></span><span class="s"></span></div>
        <div class="sx-tile" id="t-pills"><span class="l" data-k="tilePills"></span><span class="v"><span class="n">-</span><small data-k="unitPills"></small></span><span class="s"></span></div>
      </div>
      <div>
        <h2 class="sx-h" data-k="chartTitle"></h2>
        <p class="sx-note" id="chart-note"></p>
      </div>
      <div class="sx-legend" id="legend"></div>
      <div class="sx-rows" id="rows" role="list"></div>
    </section>
  </div>

  <p class="sx-disc1" data-k="disc1"></p>

  <details class="sx-more" id="more">
    <summary data-k="more"></summary>
    <div class="sx-more-body">
      <section id="func-sec">
        <h3 class="sx-h" data-k="funcTitle"></h3>
        <p class="sx-note" data-k="funcNote"></p>
        <div class="sx-scroll">
          <table class="sx-t" id="func">
            <thead><tr id="func-head"></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
      <section id="cautions-sec">
        <h3 class="sx-h" data-k="cautionsTitle"></h3>
        <ul class="sx-list" id="cautions"></ul>
      </section>
      <section>
        <h3 class="sx-h" data-k="sourcesTitle"></h3>
        <div class="sx-src" id="sources"></div>
      </section>
      <section class="sx-disc" id="disclaimer"></section>
    </div>
  </details>
</main>

<div class="sx-err" id="err" role="alert" hidden>
  <div class="sx-card">
    <h1 class="sx-h" id="err-title"></h1>
    <div id="err-body"></div>
  </div>
</div>

<script id="vitamin-data" type="application/json">__VITAMIN_DATA__</script>

    byUrl.forEach((v, url) => src.append(link(url, (v.label || new URL(url).hostname) + ' · ' + v.names.join(S.sep))));
    if (missing.length) src.append(el('span', '', missing.join(S.sep) + ' · ' + S.noSource));
    $('func-sec').hidden = !M.nutrients.some((n) => n.rda === null);
    document.querySelectorAll('[data-k]').forEach((e) => { e.textContent = S[e.dataset.k]; });
  }

  /* ---------- 갱신 ---------- */
  function setTile(id, val, tone, sub) {
    const t = $(id); t.dataset.tone = tone || '';
    const n = t.querySelector('.n'), sm = t.querySelector('small');
    if (val === null) { n.textContent = '-'; n.dataset.v = ''; if (sm) sm.hidden = true; } else { countTo(n, val); if (sm) sm.hidden = false; }
    t.querySelector('.s').textContent = sub || '';
  }

  function updateRows(res) {
    res.filter((d) => d.pr !== null).forEach((d) => {
      const e = rowEls[d.n.id];
      if (!e) return;
      e.fill.style.width = (Math.min(d.pr, CAP) / CAP * 100) + '%';
      e.fill.classList.toggle('capped', d.pr > CAP);
      Object.keys(e.segs).forEach((k) => {
        const part = d.parts.find((x) => x.product === k);
        e.segs[k].style.width = (part && d.total > 0 ? part.v / d.total * 100 : 0) + '%';
      });
      const tone = toneOf(d.rule), label = d.rule ? d.rule.label : '';
      countTo(e.pct, d.pr); e.pct.dataset.t = tone;
      if (e.chip.dataset.k !== (d.rule ? d.rule.key : '')) {
        const had = e.chip.dataset.k !== undefined;
        e.chip.dataset.k = d.rule ? d.rule.key : ''; e.chip.textContent = label; e.chip.dataset.t = tone;
        if (had && !reduce) { e.chip.classList.remove('pop'); void e.chip.offsetWidth; e.chip.classList.add('pop'); }
      }
      e.row.setAttribute('aria-label', d.n.name + ' ' + fmt(d.pr) + '%' + (label ? ', ' + label : ''));
    });
  }

  function updateSummary(res) {
    const over = res.filter((d) => toneOf(d.rule) === 'bad');
    const low = res.filter((d) => d.pr !== null && d.rule && d.rule.low);
    const look = res.filter((d) => d.rule && (d.rule.tone === 'warn' || d.rule.low));
    const withUl = res.filter((d) => d.pu !== null);
    const closest = withUl.reduce((a, d) => (a === null || d.pu > a.pu ? d : a), null);
    setTile('t-ul', closest ? closest.pu : null, closest ? toneOf(closest.rule) : '', closest ? closest.n.name : S.noUl);
    setTile('t-low', low.length, low.length ? 'warn' : 'ok');
    setTile('t-over', over.length, over.length ? 'bad' : 'ok');
    setTile('t-pills', M.products.reduce((a, p) => a + doses[p.id], 0), '');

    const badge = $('badge'), say = $('say');
    let tone = 'ok', text = S.sayOk;
    if (over.length) {
      tone = 'bad';
      const names = nameList(over.map((d) => d.n.name), 5);
      text = S.sayOver(names, iga(names), low.length);
    } else if (look.length) {
      tone = 'warn';
      text = low.length ? S.sayLow(low.length, nameList(low.map((d) => d.n.name), 5)) : S.sayWarn(nameList(look.map((d) => d.n.name), 5));
    }
    badge.dataset.tone = tone; badge.textContent = S.badge[tone];
    if (M.products.some((p) => !p.drug && p.label !== null && doses[p.id] > p.label)) text += S.sayLabel;
    say.textContent = text;
    updateBanners(over);
  }

  function updateBanners(over) {
    const box = $('banners');
    let dyn = box.querySelector('[data-dyn]');
    if (!over.length) { if (dyn) dyn.remove(); return; }
    if (!dyn) { dyn = el('p', 'sx-banner'); dyn.dataset.dyn = '1'; box.append(dyn); }
    /* disclaimer.md §3-4 자리 표시: 한국어 [성분명], 영어 [ingredient] */
    const names = over.map((d) => d.n.name).join(S.sep);
    dyn.textContent = M.ulBanner.split('[성분명]').join(names).split('[ingredient]').join(names);
  }

  function updateTable(res) {
    const tb = document.querySelector('#func tbody');
    tb.replaceChildren();
    res.filter((d) => d.n.rda === null).forEach((d) => {
      const tr = el('tr');
      const cells = [[d.n.name, ''], [fmt(d.total), 'num'], [d.n.unit, ''], [d.n.refRange || '-', ''], [d.n.ul !== null ? fmt(d.n.ul) : '-', 'num']];
      cells.forEach(([t, c]) => tr.append(el('td', c, t)));
      /* 권장량이 없어도 상한 규칙에 걸리면 상한 칸 옆에 판정 라벨 (위 막대 목록에는 이 성분이 없다) */
      if (d.n.ul !== null && d.rule && (d.rule.tone === 'bad' || d.rule.metric === 'ul_pct')) {
        const ch = el('span', 'sx-chip', d.rule.label); ch.dataset.t = d.rule.tone;
        tr.children[4].append(ch);
      }
      const td = el('td');
      if (d.n.url) td.append(link(d.n.url, d.n.sourceLabel || S.srcWord)); else td.textContent = S.noSource;
      tr.append(td); tb.append(tr);
    });
  }

  function update() {
    const res = compute();
    res.forEach((d) => { last[d.n.id] = d; });
    M.products.forEach((p) => {
      const e = prodEls[p.id], n = doses[p.id];
      e.cnt.replaceChildren(); e.cnt.append(el('b', '', fmt(n)), document.createTextNode(' ' + p.unit));
      e.minus.disabled = p.drug || n <= 0; e.plus.disabled = p.drug || n >= p.max;
      e.row.classList.toggle('changed', n !== p.now);
      e.wn.hidden = !(!p.drug && p.label !== null && n > p.label);
    });
    const same = (f) => M.products.every((p) => doses[p.id] === f(p));
    $('pre-now').setAttribute('aria-pressed', String(same((p) => p.now)));
    $('pre-plan').setAttribute('aria-pressed', String(same(planTarget)));
    updateRows(res); updateSummary(res); updateTable(res);
  }

  /* ---------- 시작 / 오류 ---------- */
  function showError(e) {
    $('app').hidden = true;
    const known = curLang ? [curLang] : ['ko', 'en'];
    const body = $('err-body'); body.replaceChildren();
    const code = e instanceof DataError ? e.code : 'render';
    known.forEach((lg) => {
      const T = STR[lg];
      if (lg === known[0]) $('err-title').textContent = T.errTitle;
      body.append(el('p', '', T.err[code] || T.err.render));
    });
    const detail = e instanceof DataError ? e.detail : String(e && e.message ? e.message : e);
    if (detail) body.append(el('p', 'd', detail));
    body.append(el('p', 'sx-note', STR[known[0]].errHint));
    if (known.length > 1) body.append(el('p', 'sx-note', STR[known[1]].errHint));
    $('err').hidden = false;
    document.title = STR[known[0]].errTitle;
  }

  function init() {
    try {
      M = parseModel($('vitamin-data').textContent);
      S = STR[M.lang];
      const loc = M.lang === 'ko' ? 'ko-KR' : 'en-US';
      nf = new Intl.NumberFormat(loc, { maximumFractionDigits: 2 });
      nf1 = new Intl.NumberFormat(loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      document.documentElement.lang = M.lang;
      M.products.forEach((p) => { doses[p.id] = p.now; });
      buildStatic();
      M.banners.forEach((t) => $('banners').append(el('p', 'sx-banner', t)));
      buildProducts(); buildPlan(); buildRows();
      $('app').hidden = false;
      update();
    } catch (e) {
      showError(e);
    }
  }
  init();
})();
</script>
</body>
</html>
